<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Archivo de detección de Netlify Forms.
      El sitio se renderiza en SSR, por lo que Netlify no puede detectar el
      formulario de <Contact />. Este HTML estático declara el formulario
      (nombre, campos y honeypot) durante el build. No se enlaza en el sitio.
      Los campos deben coincidir con los de src/components/Contact.tsx.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
